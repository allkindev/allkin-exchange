<div class="rc-app" id="app">
  <!-- Narrow screens: a panel opens over the page, a click beside it closes it. -->
  <div class="rc-scrim" id="scrim"></div>

  <aside class="rc-side rc-history-panel" id="history-panel">
    <header class="rc-side-head">
      <h2 class="rc-side-title" data-i18n="history.title"></h2>
      <button type="button" class="rc-tool" id="new" data-i18n-aria-label="action.new" data-i18n-title="action.new"><svg><use href="#i-plus"/></svg></button>
      <button type="button" class="rc-tool rc-side-close" data-close="history" data-i18n-aria-label="action.close"><svg><use href="#i-x"/></svg></button>
    </header>
    <label class="rc-search">
      <svg><use href="#i-magnifying-glass"/></svg>
      <input type="search" id="history-search" autocomplete="off" data-i18n-placeholder="history.search" data-i18n-aria-label="history.search">
    </label>
    <div class="rc-history" id="history"></div>
    <p class="rc-side-empty hidden" id="history-empty"></p>
  </aside>

  <main class="rc-main">
    <!-- The one bar of the page: what is shown, then its tools. -->
    <header class="rc-bar">
      <button type="button" class="rc-tool" id="history-toggle" data-i18n-aria-label="history.title" data-i18n-title="history.title"><svg><use href="#i-sidebar-simple"/></svg></button>
      <div class="rc-heading">
        <input type="text" class="rc-title" id="title" maxlength="200" autocomplete="off" data-i18n-placeholder="title.placeholder" data-i18n-aria-label="title.label">
        <span class="rc-meta" id="meta"></span>
      </div>
      <div class="rc-bar-actions">
        <button type="button" class="rc-tool" id="find-toggle" data-i18n-aria-label="find.title" data-i18n-title="find.title"><svg><use href="#i-magnifying-glass"/></svg></button>
        <button type="button" class="rc-tool" id="times-toggle" aria-pressed="true" data-i18n-aria-label="times.toggle" data-i18n-title="times.toggle"><svg><use href="#i-clock"/></svg></button>
        <button type="button" class="rc-tool rc-labelled" id="copy"><svg><use href="#i-copy"/></svg><span data-i18n="action.copy"></span></button>
        <button type="button" class="rc-tool rc-labelled" id="export" aria-haspopup="menu"><svg><use href="#i-download-simple"/></svg><span data-i18n="action.export"></span></button>
        <button type="button" class="rc-tool" id="more" aria-haspopup="menu" data-i18n-aria-label="action.more" data-i18n-title="action.more"><svg><use href="#i-dots-three"/></svg></button>
        <button type="button" class="rc-tool" id="speakers-toggle" data-i18n-aria-label="speakers.title" data-i18n-title="speakers.title"><svg><use href="#i-users"/></svg></button>
      </div>
    </header>

    <!-- Search in the transcript shown. -->
    <div class="rc-find hidden" id="find" role="search">
      <svg><use href="#i-magnifying-glass"/></svg>
      <input type="search" id="find-input" autocomplete="off" spellcheck="false" data-i18n-placeholder="find.placeholder" data-i18n-aria-label="find.placeholder">
      <span class="rc-find-count" id="find-count"></span>
      <button type="button" class="rc-tool" id="find-prev" data-i18n-aria-label="find.previous" data-i18n-title="find.previous"><svg><use href="#i-caret-up"/></svg></button>
      <button type="button" class="rc-tool" id="find-next" data-i18n-aria-label="find.next" data-i18n-title="find.next"><svg><use href="#i-caret-down"/></svg></button>
      <button type="button" class="rc-tool" id="find-close" data-i18n-aria-label="action.close" data-i18n-title="action.close"><svg><use href="#i-x"/></svg></button>
    </div>

    <p class="rc-notice hidden" id="notice" role="alert"></p>

    <div class="rc-stage">
      <section class="rc-transcript" id="transcript" aria-live="polite"></section>
      <div class="rc-empty" id="empty">
        <span class="rc-empty-icon"><svg><use href="#i-waveform"/></svg></span>
        <h2 data-i18n="empty.title"></h2>
        <p class="rc-empty-lead" data-i18n="empty.lead"></p>
        <ul class="rc-empty-points">
          <li><svg><use href="#i-users"/></svg><span data-i18n="empty.rename"></span></li>
          <li><svg><use href="#i-note-pencil"/></svg><span data-i18n="empty.edit"></span></li>
          <li><svg><use href="#i-check"/></svg><span data-i18n="empty.background"></span></li>
        </ul>
      </div>
      <button type="button" class="rc-latest hidden" id="latest"><svg><use href="#i-arrow-down"/></svg><span data-i18n="action.latest"></span></button>
    </div>

    <!-- The recorder: its state and the sound heard, the transport, the clock. -->
    <footer class="rc-dock" id="dock" data-phase="idle">
      <div class="rc-dock-side">
        <span class="rc-status" id="status" role="status"><i class="rc-status-dot"></i><span id="status-text"></span></span>
        <canvas class="rc-wave" id="wave" aria-hidden="true"></canvas>
      </div>
      <div class="rc-transport">
        <button type="button" class="rc-round hidden" id="pause"><svg><use href="#i-pause"/></svg></button>
        <button type="button" class="rc-record" id="record"><svg><use href="#i-microphone"/></svg><span></span></button>
      </div>
      <div class="rc-dock-side rc-dock-end">
        <span class="rc-saved" id="saved"></span>
        <time class="rc-clock" id="clock">00:00</time>
      </div>
    </footer>
  </main>

  <aside class="rc-side rc-speakers-panel" id="speakers-panel">
    <header class="rc-side-head">
      <h2 class="rc-side-title" data-i18n="speakers.title"></h2>
      <button type="button" class="rc-tool rc-side-close" data-close="speakers" data-i18n-aria-label="action.close"><svg><use href="#i-x"/></svg></button>
    </header>
    <!-- Who spoke how much, at a glance. -->
    <div class="rc-share hidden" id="share" aria-hidden="true"></div>
    <ul class="rc-speakers" id="speakers"></ul>
    <p class="rc-side-empty" id="speakers-empty" data-i18n="speakers.empty"></p>
    <h2 class="rc-side-title rc-side-sub" data-i18n="details.title"></h2>
    <dl class="rc-details" id="details"></dl>
  </aside>
</div>

<!-- Export formats, and the other actions on the transcript. -->
<div class="rc-menu hidden" id="menu" role="menu"></div>
<div class="rc-toast" id="toast" role="status" aria-live="polite"></div>
<script src="locales.js"></script>
<script src="app.js"></script>
</body>
</html>
